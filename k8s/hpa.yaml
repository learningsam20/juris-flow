apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: jurisflow-api
  namespace: jurisflow
  labels:
    app: jurisflow
    component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: jurisflow-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70