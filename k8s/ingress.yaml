apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jurisflow
  namespace: jurisflow
  labels:
    app: jurisflow
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - jurisflow.example.com
      secretName: jurisflow-tls
  rules:
    - host: jurisflow.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: jurisflow-api
                port:
                  number: 5606