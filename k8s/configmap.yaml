apiVersion: v1
kind: ConfigMap
metadata:
  name: jurisflow-config
  namespace: jurisflow
  labels:
    app: jurisflow
data:
  JAIL_DATABASE_URL: "sqlite:////data/jurisflow.db"
  JAIL_SECRET_KEY: "CHANGE-ME-IN-PRODUCTION"
  JAIL_LOG_LEVEL: "INFO"
  JAIL_LLM_PROVIDER: "ollama"
  JAIL_LLM_MODEL: "llama3.2:latest"
  JAIL_ASK_LLM_MODEL: "gemma4:latest"
  JAIL_ASK_LLM_TEMPERATURE: "0.1"
  JAIL_OLLAMA_BASE_URL: "http://ollama:11434"
  JAIL_EMBEDDING_PROVIDER: "ollama"
  JAIL_EMBEDDING_MODEL: "all-minilm"
  JAIL_VECTOR_PROVIDER: "qdrant"
  JAIL_QDRANT_URL: "http://qdrant:6333"
  JAIL_OCR_ENABLED: "true"
  JAIL_OCR_PROVIDER: "tesseract"
  JAIL_RATE_LIMIT_ENABLED: "true"