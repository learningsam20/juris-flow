apiVersion: apps/v1
kind: Deployment
metadata:
  name: jurislab-api
  namespace: jurislab
  labels:
    app: jurislab
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jurislab
      component: api
  template:
    metadata:
      labels:
        app: jurislab
        component: api
    spec:
      containers:
        - name: api
          image: jurislab/api:latest
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: jurislab-config
          env:
            - name: JAIL_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: jurislab-secrets
                  key: JAIL_SECRET_KEY
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: jurislab-data
---
apiVersion: v1
kind: Service
metadata:
  name: jurislab-api
  namespace: jurislab
  labels:
    app: jurislab
    component: api
spec:
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app: jurislab
    component: api