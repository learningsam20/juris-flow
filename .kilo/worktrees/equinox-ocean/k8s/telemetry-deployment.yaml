apiVersion: apps/v1
kind: Deployment
metadata:
  name: jurislab-telemetry
  namespace: jurislab
  labels:
    app: jurislab
    component: telemetry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jurislab
      component: telemetry
  template:
    metadata:
      labels:
        app: jurislab
        component: telemetry
    spec:
      containers:
        - name: telemetry
          image: jurislab/telemetry:latest
          ports:
            - containerPort: 8002
              protocol: TCP
          envFrom:
            - configMapRef:
                name: jurislab-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10