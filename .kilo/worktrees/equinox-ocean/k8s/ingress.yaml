apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jurislab
  namespace: jurislab
  labels:
    app: jurislab
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - jurislab.example.com
      secretName: jurislab-tls
  rules:
    - host: jurislab.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: jurislab-api
                port:
                  number: 8000