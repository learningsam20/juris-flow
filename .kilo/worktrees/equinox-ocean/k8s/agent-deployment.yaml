apiVersion: apps/v1
kind: Deployment
metadata:
  name: jurislab-agent
  namespace: jurislab
  labels:
    app: jurislab
    component: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jurislab
      component: agent
  template:
    metadata:
      labels:
        app: jurislab
        component: agent
    spec:
      containers:
        - name: agent
          image: jurislab/agent:latest
          ports:
            - containerPort: 8001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: jurislab-config
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10