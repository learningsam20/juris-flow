services:
  backend:
    build: ./backend
    ports:
      - "5273:8000"
    env_file:
      - path: backend/.env
        required: false
    environment:
      - JAIL_DATABASE_URL=sqlite:///data/jurislab.db
      - JAIL_QDRANT_PATH=/data/qdrant
    volumes:
      - backend-data:/app/data
    depends_on: []
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    profiles:
      - llm

  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports:
      - "5275:6333"
      - "5276:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    profiles:
      - vector

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yml"]
    ports:
      - "5277:4317"
      - "5278:4318"
    volumes:
      - ./otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    profiles:
      - telemetry

volumes:
  backend-data:
  ollama-data:
  qdrant-data:
