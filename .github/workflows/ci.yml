name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, typecheck, tests, Rego)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff lint + format check
        working-directory: backend
        run: python -m ruff check app tests && python -m ruff format --check app tests
      - name: mypy static checks
        working-directory: backend
        run: python -m mypy app
      - name: Backend pytest suite
        working-directory: backend
        run: python -m pytest tests -q
      - name: Rego policy tests
        run: ./scripts/rego_test.sh
      - name: Dependency vulnerability scan
        working-directory: backend
        run: |
          pip install pip-audit
          python -m pip_audit --requirement requirements.txt --requirement requirements-dev.txt
      - name: Generate SBOM
        working-directory: backend
        run: |
          pip install cyclonedx-bom
          python -m cyclonedx_py environment -o ../docs/sbom.json
          python -c "import json; json.load(open('../docs/sbom.json'))"

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: npm audit (known vulnerabilities)
        working-directory: frontend
        run: npm audit --audit-level=high

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      - name: CI-local fallback (pre-hist version, works without license)
        if: failure() && github.event_name == 'pull_request'
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gitleaks.tgz
          ./gitleaks detect --source . --redact --exit-code 0

  eval:
    name: Eval (static validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Compile-check eval Python sources
        working-directory: eval
        run: |
          python -m compileall -q deepeval/helpers.py deepeval/tests
      - name: Validate promptfoo config (YAML + inline prompts)
        working-directory: eval
        run: |
          python -m pip install pyyaml
          python -c "import yaml; yaml.safe_load(open('promptfoo/promptfooconfig.yaml')); print('promptfoo config OK')"
